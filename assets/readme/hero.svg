<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">JSON 工作台 JSON Workbench — 本地优先的 Chrome JSON 工具</title>
  <desc id="desc">暖纸底编辑风标题：JSON 工作台，副标题脏 JSON 修好，再派生出代码；右侧是修复示意：左侧残缺的 JSON 代码经过箭头变成右侧格式化的 JSON，下方是 Schema、TypeScript、Zod、Pydantic、Mock 五个派生输出标签。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf8f3"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6b645e">本地优先的 CHROME JSON 工具 · LOCAL-FIRST</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1c1917">JSON 工作台</text>
    <text x="56" y="168" font-size="23" fill="#44403c">JSON WORKBENCH — 脏 JSON 修好，再派生出代码</text>
    <text x="56" y="204" font-size="19" fill="#6b645e">格式化、Schema、TS、Zod、Pydantic、Mock，全本地跑。</text>
    <g id="chips" font-size="18" fill="#1c1917" text-anchor="middle">
      <g><rect x="56" y="238" width="162" height="36" rx="18" fill="#ffffff" stroke="#d6d3cd" stroke-width="1.5"/><text x="137" y="262">本地优先 · 零网络</text></g>
      <g><rect x="230" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3cd" stroke-width="1.5"/><text x="293" y="262">修复脏 JSON</text></g>
      <g><rect x="368" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3cd" stroke-width="1.5"/><text x="431" y="262">8 种派生输出</text></g>
      <g><rect x="506" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#d6d3cd" stroke-width="1.5"/><text x="560" y="262">中英 Mock</text></g>
    </g>
  </g>

  <g id="repair-demo" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g id="panel-dirty">
      <rect x="692" y="48" width="200" height="200" rx="10" fill="#ffffff" stroke="#e7e2d8" stroke-width="1.5"/>
      <text x="708" y="76" font-size="18" fill="#b45309">脏 JSON · 输入</text>
      <text x="708" y="112" font-size="18" fill="#1c1917">{</text>
      <text x="724" y="140" font-size="18" fill="#1c1917">"city": "上海",</text>
      <text x="724" y="168" font-size="18" fill="#dc2626">"status: "ok",</text>
      <text x="724" y="196" font-size="18" fill="#1c1917">"age": 30</text>
      <text x="708" y="224" font-size="18" fill="#dc2626">}</text>
    </g>
    <g id="arrow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="908" y="152" font-size="28" fill="#c2410c" text-anchor="middle">→</text>
    </g>
    <g id="panel-clean">
      <rect x="924" y="48" width="220" height="200" rx="10" fill="#ffffff" stroke="#e7e2d8" stroke-width="1.5"/>
      <text x="940" y="76" font-size="18" fill="#15803d">VALID · 已修复</text>
      <text x="940" y="112" font-size="18" fill="#1c1917">{</text>
      <text x="956" y="140" font-size="18" fill="#1c1917">"city": "上海",</text>
      <text x="956" y="168" font-size="18" fill="#1c1917">"status": "ok",</text>
      <text x="956" y="196" font-size="18" fill="#1c1917">"age": 30</text>
      <text x="940" y="224" font-size="18" fill="#1c1917">}</text>
    </g>
    <g id="outputs" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#9a3412" text-anchor="middle">
      <g><rect x="692" y="268" width="86" height="32" rx="16" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/><text x="735" y="290">Schema</text></g>
      <g><rect x="786" y="268" width="108" height="32" rx="16" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/><text x="840" y="290">TypeScript</text></g>
      <g><rect x="902" y="268" width="62" height="32" rx="16" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/><text x="933" y="290">Zod</text></g>
      <g><rect x="972" y="268" width="92" height="32" rx="16" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/><text x="1018" y="290">Pydantic</text></g>
      <g><rect x="1072" y="268" width="72" height="32" rx="16" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/><text x="1108" y="290">Mock</text></g>
    </g>
    <text x="918" y="336" font-size="18" fill="#6b645e" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">无 AI · 无遥测 · 无网络请求</text>
  </g>
</svg>
